[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prune"
version = "0.1.0"
description = "From-scratch compiler, optimizer, and explainable bundler"
authors = [{ name = "Prune Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "typer>=0.9.0",
    "rich>=13.7.0"
]

[project.scripts]
prune = "prune.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
